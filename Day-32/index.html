<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="student-form">
        <h1>Student Details</h1>
        <from action="https://www.youtube.com">
            <label for="first-name">Frist Name</label>
            <input type="text" placeholder="meena" value="Rock"  name="fname" id="first-name" required/>
            <br/>
            <br/>
            <label for="Last-name">Last Name</label>
            <input type="text" placeholder="doe" value="Star" name="lname" id="Last-name" required/>
            <br/>
            <br/>
            <label for="email">Email</label>
            <input type="email" placeholder="abc@gamil.com" value="rock@gamil.com" name="email" id="email" required />
             <br/>
            <br/>
            <p>Select the gender</p>  
            <input type="radio" id="female" name="gender" value="female" class="gender"required />
            <label for="female">Female</label>
             <input type="radio" id="male" name="gender" value="male" class="gender" required/>
            <label for="male">Male</label>
             <input type="radio" id="other" name="gender" value="other" class="gender" required/>
            <label for="other">Other</label>
             <br/>
            <br/>
            <input type="submit" value="Student-Details" class="submit"/>
        </from>
    </div>
</body>
</html>
