<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="form-container">
        <h2>Techfest 2026 Registration</h2>
        <form>
            <div class="form-group">
                 <label for="fullname">FullName:</label>
                 <input type="text" id="fullname" name="FullName" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                 <label for="email">College Email:</label>
                 <input type="email" id="email" name="email" placeholder="student@College.com" required>
            </div>
            <div class="form-group">
                 <label for="phone">Phone Number:</label>
                 <input type="tel" id="phone" name="phone" placeholder="10-digit mobile-number" required>
            </div>
            <div class="form-group">
                 <label for="department">Department:</label>
                 <select id="department" name="department">
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics and Communication</option>
                    <option value="mech">Mechnical Engineering</option>
                    <option value="civil">Civil Engineering</option>
                 </select>
            </div>
            <div class="form-group">
                 <label>Select Events:</label>
                 <input type="checkbox" id="coding" name="Event" value="coding">
                 
            </div>
        </form>
    </div>
</body>
</html>
