<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unordered list</title>
</head>
<body>
    <h1>list of food items</h1>
    <ul style="list-style: square;">
        <li>cake</li>
        <li>ice cream</li>
        <li>chips</li>
        <li>fruits</li>
    </ul>
    <ul style="list-style: none;">
        <li>cake</li>
        <li>ice cream</li>
        <li>chips</li>
        <li>fruits</li>
    </ul>
    <ul style="list-style: circle;">
        <li>cake</li>
        <li>ice cream</li>
        <li>chips</li>
        <li>fruits</li>
    </ul>
</body>
</html>
