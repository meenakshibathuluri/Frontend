<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
     <div class="container">

    <div class="left">
        <div class="logo">f</div>
        <div>
            <img src="facebook.webp" alt="facebook" height="600px" width="800px"/>
        </div>
        <div class="text">
            <h1>Explore<br>the<br>things<br><span>you love.</span></h1>
        </div>
    </div>

    <div class="right">
        <div class="login-box">

            <h2>Log in to Facebook</h2>

            <input type="text" placeholder="Email address or mobile number">

            <input type="password" placeholder="Password">

            <button class="login-btn">Log in</button>

            <div class="forgot">Forgotten password?</div>
            
            <button class="create-btn">Create new account</button>
        </div>
    </div>

</div>
</body>
</html>
