<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested list</title>
</head>
<body>
    <ol style="list-style: disc;">
        <li>
            java
            <ul style="list-style: none;">
                <li>hello world</li>
                <li>variables</li>
                <li>data type</li>
            </ul>
        </li>
        <li>
            html
            <ul style="list-style: circle;">
                <li>head</li>
                <li>broder color</li>
                <li>body</li>
            </ul>
        </li>
        <li>
            css
        </li>
        <li>
            parttern
        </li>
    </ol>
</body>
</html>
