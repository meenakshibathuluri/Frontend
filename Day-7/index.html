<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ordered list</title>
</head>
<body>
    <h1>List of jewellery</h1>
    <ol>
        <li>long chain</li>
        <li>ear rings</li>
        <li>bangles</li>
    </ol>
    <ol style="list-style: circle;">
        <li>long chain</li>
        <li>ear rings</li>
        <li>bangles</li>
    </ol>
    <ol style="list-style: none;">
        <li>long chain</li>
        <li>ear rings</li>
        <li>bangles</li>
    </ol>
</body>
</html>
