<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
    <style>
        table,td,th {
            border: 3px solid black;
            border-collapse: collapse;
        }
        td {
           color: rgb(177, 124, 45);
        }
        th {
            color: rgb(181, 48, 48);
        }
    </style>
</head>
<body>
    <table>
      <caption>list of items</caption>
       <tr>
        <th>id</th>
        <th>items</th>
        <th>prices of items</th>
       </tr>
       <tr>
        <td>1</td>
        <td>lalipops</td>
        <td>20</td>
       </tr>
       <tr>
        <td>2</td>
        <td>kurkure</td>
        <td>30</td>
       </tr>
       <tr>
        <td>3</td>
        <td>lays</td>
        <td>100</td>
       </tr>
       <tr>
        <td>4</td>
        <td>dairy milk</td>
        <td>180</td>
       </tr>
    </table>
</body>
</html>
