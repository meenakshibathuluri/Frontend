<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Finlandica+Text:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="images-container">
        <div class="insta-logo"></div>
        <h1 class="insta-text">
          See everyday moments from your
          <span class="close-friends">close friends</span>.
        </h1>
        <img src="instagram.webp" class="image" />
      </div>
      <div class="form-container">
        <h2 class="log-into">Log into Instagram</h2>
        <input
          class="mobile-number"
          type="text, email"
          required
          placeholder="Mobile number, Username or email"
        />
        <input
          class="password"
          type="text, number,"
          placeholder="Password"
          required
        />
        <br />
        <button class="submiit">Login</button>
        <h3 class="forget-password">Forget password?</h3>
        <div class="facebook-login">
          <button class="login">
            <i class="fa-brands fa-facebook"> </i>
            <h3>Login with Facebook</h3>
          </button>
          <button class="create-button"><h3>Create new account</h3></button>
        </div>
      </div>
    </div>
  </body>
</html>
