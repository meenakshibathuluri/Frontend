<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table,td,th {
            border: 4px solid greenyellow;
            border-collapse: collapse;
        }
        th {
            color: cornsilk;
            background-color: chocolate;
        }
        td {
            color: brown;
            background-color: darkgoldenrods;
        }
    </style>
</head>
<body>
    <h1>students in java Batch</h1>
    <table>
        <caption>
            Batch student
        </caption>
        <thead>
            <tr>
                <th>id</th>
                <th>name of the student</th>
                <th>course</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>meenakshi</td>
                <td>fullstack java</td>
            </tr>
            <tr>
                <td>2</td>
                <td>firdose</td>
                <td>fullstack java</td>
            </tr>
        </tbody>
        <tfoot>
            <td></td>
            <td>total students</td>
            <td>2</td>
        </tfoot>
    </table>
</body>
</html>
