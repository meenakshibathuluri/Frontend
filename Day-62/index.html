<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo App</title>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .todo-container {
      width: 350px;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      text-align: center;
      color: #764ba2;
      margin-bottom: 25px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
    }
    ul {
      list-style: none;
    }
    ul li {
      padding: 14px;
      margin-bottom: 12px;
      color: white;
      border-radius: 10px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
      transition: transform 0.3s;
    }
    ul li:hover {
      transform: translateX(5px);
    }
    ul li:nth-child(2) {
      background: linear-gradient(90deg, #f093fb, #f5576c);
    }
    ul li:nth-child(3) {
      background: linear-gradient(90deg, #43cea2, #185a9d);
    }
    ul li:nth-child(4) {
      background: linear-gradient(90deg, #fa709a, #fee140);
    }
    ul li span {
      margin-right: 8px;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 13px;
    }
 </style>
</head>
<body>
  <div class="todo-container">
    <h1>✨ My Todo List</h1>
    <input type="text" placeholder="Add a new task...">
    <ul>
      <li><span>✓</span> Learn HTML</li>
      <li><span>✓</span> Practice CSS</li>
      <li><span>✓</span> Build a project</li>
      <li><span>✓</span> Read a book</li>
    </ul>
    <div class="footer">
      Stay focused and get things done!
    </div>
  </div>
</body>
</html>
