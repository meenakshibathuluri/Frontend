<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form novalidate method="get" >
        <label for="first-name">Frist Name</label>
            <input type="text" name="f-name" id="first-name" maxlength="30"/>
            <br/>
            <br/>
            <label for="Last-name">Last Name</label>
            <input type="text" name="l-name" id="Last-name" maxlength="30"/>
            <br/>
            <br/>
            <label for="email">Email</label>
            <input type="email"  name="email" id="email" maxlength="30" />
             <br/>
            <br/>
            <p>Gender: </p>  
            <label for="female">Female</label>
            
            <input type="radio" id="female" name="gender" required maxlength="30" />
             <label for="male">Male</label>
             <input type="radio" id="male" name="gender"  required maxlength="30"/>
              <label for="other">Other</label>
             <input type="radio" id="other" name="gender" required maxlength="30"/>
             <br/>
            <br/>
            <label for="date-of-birth">Date of Birth</label>
            <input type="date" id="date-of-birth" name="date-of-birth" required />
            <br/>
            <br/>
            <p>Skill</p>
            <input type="checkbox" id="java" name="java"/>
            <label id="java">Java</label>
            <input type="checkbox" id="html" name="html"/>
            <label id="html">html</label>
            <input type="checkbox" id="css" name="css"/>
            <label id="css">Java</label>
            <input type="checkbox" id="javascript" name="javascript"/>
            <label id="javascript">javascript</label>
            <br/>
            <br/>
            <input type="submit"/>
    </form>
</body>
</html>
